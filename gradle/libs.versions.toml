[versions]
agp = "8.7.3"
kotlin = "1.9.23"

coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.12.0"
constraintlayout = "2.2.1"
navigation-compose = "2.9.0"
google-services = "4.4.3"
firebase-bom = "33.1.0"

# --- Jetpack Compose Versions ---
androidxComposeBom = "2023.10.01"
androidxActivityCompose = "1.10.1"
androidxLifecycleRuntimeCompose = "2.9.1"
androidxLifecycle = "2.9.1"
material3Android = "1.3.2"
uiAndroid = "1.8.3"
firebaseCrashlyticsBuildtools = "3.0.4"
json = "2.10.1"
firebaseDatabaseKtx = "21.0.0"

hilt = "2.48.1"
javapoet = "1.13.0"
hilt-navigation-compose = "1.1.0"
composeCompiler = "1.5.12"
datastore = "1.1.1"
coil  = "2.6.0"
foundationLayoutAndroid = "1.7.2"
compose_version = "1.6.8"

androidx_window = "1.5.1"
playServicesAuth = "20.7.0"
app-update  = "2.1.0"

[libraries]
# Core Android
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "json" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# --- Jetpack Compose Libraries ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivityCompose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "uiAndroid" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "uiAndroid" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "uiAndroid" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3Android" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycleRuntimeCompose" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "androidxLifecycle" }

# Tooling and testing
debugImplementation = { module = "androidx.compose.ui:ui-tooling", version.ref = "uiAndroid" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "uiAndroid" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "uiAndroid" }

firebase-crashlytics-buildtools = { group = "com.google.firebase", name = "firebase-crashlytics-buildtools", version.ref = "firebaseCrashlyticsBuildtools" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-database-ktx = { group = "com.google.firebase", name = "firebase-database-ktx", version.ref = "firebaseDatabaseKtx" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-auth-ktx = { group = "com.google.firebase", name = "firebase-auth-ktx" }

androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "androidxLifecycle" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
javapoet = { group = "com.squareup", name = "javapoet", version.ref = "javapoet" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

coil-kt = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

androidx-foundation-layout-android = { group = "androidx.compose.foundation", name = "foundation-layout-android", version.ref = "foundationLayoutAndroid" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose_version" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx_window" }
androidx-window-core = { module = "androidx.window:window-core", version.ref = "androidx_window" }

play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
google-android-play-app-update = { module = "com.google.android.play:app-update", version.ref = "app-update" }
google-android-play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "app-update" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-google-service = { id = "com.google.gms.google-services", version.ref = "google-services" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }